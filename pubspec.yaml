
name: lumi_spa
description: "LUMI SPA - Beauty & Wellness Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.0.0

  # State management
  flutter_riverpod: ^3.0.0

  # UI and typography
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF7F4"
  adaptive_icon_foreground: "assets/images/logo_adaptive_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
